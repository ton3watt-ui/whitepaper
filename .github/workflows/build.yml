name: Build Whitepaper PDFs

on:
  push:
    branches: ["master"]
    paths:
      - "**.tex"
      - "figures/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "**.tex"
      - "figures/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile LaTeX to PDF
    runs-on: ubuntu-latest
    container:
      image: evilmachines/texlive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all whitepapers
        run: |
          set -e
          for tex in *.tex; do
            echo "Compiling $tex (pass 1) ..."
            lualatex -interaction=nonstopmode -halt-on-error "$tex"
            echo "Compiling $tex (pass 2) ..."
            lualatex -interaction=nonstopmode -halt-on-error "$tex"
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdfs
          path: "*.pdf"
          retention-days: 90

      - name: Commit updated PDFs to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "chore: update compiled PDFs [skip ci]"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:master
          fi
